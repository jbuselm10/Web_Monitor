---
deployment:
  tasks:
    # Copies only the files the cron job needs into the run directory.
    # .env is never in git and lives only in the run directory, so it is
    # left untouched by deploys.
    # Absolute path is required: cPanel sets $HOME to a temp directory
    # (/home/buselmei/tmp) while running deployment tasks.
    - export DEPLOYPATH=/home/buselmei/webmonitor
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp cron_check.py $DEPLOYPATH/
    - /bin/cp urls.txt $DEPLOYPATH/
    - /bin/cp email_recipients.txt $DEPLOYPATH/
    - /bin/cp notify_chats.txt $DEPLOYPATH/
